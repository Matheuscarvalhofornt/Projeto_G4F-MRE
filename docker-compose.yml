services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mre_news}
      POSTGRES_USER: ${POSTGRES_USER:-mre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mre_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-mre}:${POSTGRES_PASSWORD:-mre_local_password}@db:5432/${POSTGRES_DB:-mre_news}?schema=public
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    ports:
      - '${API_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3333/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      API_UPSTREAM: api:3333
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
